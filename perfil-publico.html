<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Perfil · Discoteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

  <div id="perfil-content" class="pp-page">
    <div style="text-align:center; padding:80px 20px; opacity:0.4; font-size:13px;">Carregando perfil...</div>
  </div>

  <footer>Discoteca — Sua coleção, suas recomendações.</footer>

  <script>
    const API_URL = 'https://fportelada.pythonanywhere.com';


// Toda chamada ao backend passa por aqui — garante que o cookie de
// sessão (login de verdade) sempre vá junto, mesmo entre domínios
// diferentes (GitHub Pages -> PythonAnywhere). Sem isso, o navegador
// não manda o cookie, e a autenticação real nunca chega a funcionar.
function apiFetch(url, opcoes = {}) {
  const sessaoToken = localStorage.getItem('discoteca_session_token');
  const opcoesFinais = { ...opcoes };
  opcoesFinais.headers = { ...(opcoes.headers || {}), 'X-Session-Token': sessaoToken || '' };
  return fetch(url, opcoesFinais);
}
    const CORES_TIER = { S: 'var(--s-color)', A: 'var(--a-color)', B: 'var(--b-color)', C: 'var(--c-color)' };
    const NOME_FORMATO = { vinil: 'Vinil', cd: 'CD', cassete: 'Cassete', dvd_bluray: 'DVD/Blu-ray' };

    // ================================================================
    // LAST.FM — só como último recurso (Discogs é a fonte principal)
    // ================================================================
    const LASTFM_KEY = 'b25b959554ed76058ac220b7b2e0a026';
    async function getCoverUrlLastfm(artist, album) {
      if (!artist || !album) return null;
      try {
        const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${LASTFM_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(album)}&format=json`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.album && data.album.image) {
          const img = data.album.image.find(i => i.size === 'extralarge');
          return img && img['#text'] ? img['#text'] : null;
        }
        return null;
      } catch { return null; }
    }

    function aplicarCapa(el, url) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        el.style.backgroundImage = `url('${url}')`;
        const icone = el.querySelector('.fallback-icon');
        if (icone) icone.style.display = 'none';
      };
      img.src = url;
    }

    // Prioridade: capa já salva <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> Discogs sob demanda <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> Last.fm por último.
    // Lazy (só busca quando o card entra na tela) — importante pra coleções grandes.
    function configurarLazyLoadCapas() {
      const itens = document.querySelectorAll('[data-artista][data-album]');
      const carregar = (el) => {
        if (el.dataset.capaCarregada) return;
        el.dataset.capaCarregada = '1';
        const artista = el.dataset.artista, album = el.dataset.album, capaSalva = el.dataset.capa;
        if (capaSalva) { aplicarCapa(el, capaSalva); return; }
        apiFetch(API_URL + `/buscar_capa?artista=${encodeURIComponent(artista)}&album=${encodeURIComponent(album)}`)
          .then(r => r.json())
          .then(d => {
            if (d.sucesso && d.capa_url) aplicarCapa(el, d.capa_url);
            else getCoverUrlLastfm(artista, album).then(url => { if (url) aplicarCapa(el, url); });
          })
          .catch(() => {});
      };
      if (!('IntersectionObserver' in window)) { itens.forEach(carregar); return; }
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { carregar(entry.target); obs.unobserve(entry.target); }
        });
      }, { rootMargin: '200px' });
      itens.forEach(el => observer.observe(el));
    }

    function getCor(texto) {
      const CORES = ['#D6432F', '#E39A2E', '#4E7A8C', '#8A8378', '#5C6B7A', '#B8A88A', '#E8C87A', '#7AB8D8', '#A78BFA'];
      const hash = (texto || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      return CORES[hash % CORES.length];
    }

    // ================================================================
    // CARREGAR
    // ================================================================
    function carregarPerfil() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('id');
      if (!userId) {
        document.getElementById('perfil-content').innerHTML =
          `<div style="text-align:center; padding:80px 20px;">Perfil não especificado. Use o link com <code>?id=</code>.</div>`;
        return;
      }
      apiFetch(API_URL + `/perfil/${userId}`)
        .then(async r => {
          if (!r.ok) {
            const corpo = await r.json().catch(() => ({}));
            throw new Error(corpo.erro || 'Perfil não encontrado');
          }
          return r.json();
        })
        .then(renderPerfil)
        .catch(err => {
          document.getElementById('perfil-content').innerHTML =
            `<div style="text-align:center; padding:80px 20px;">${err.message || 'Erro ao carregar perfil'}</div>`;
        });
    }

    function montarCoverDiv(item) {
      const cor = getCor(item.artista);
      const capaAttr = item.capa_url ? ` data-capa="${escapeHtml(item.capa_url)}"` : '';
      return `data-artista="${escapeHtml(item.artista || '')}" data-album="${escapeHtml(item.album || '')}"${capaAttr} style="background-color:${cor}; background-size:cover; background-position:center;"`;
    }

    // Escapa qualquer texto vindo de dados do usuário (bio, nome, artista,
    // álbum, etc.) antes de inserir no HTML — sem isso, alguém poderia
    // colocar <script> na própria bio e rodar código no navegador de
    // QUALQUER visitante do perfil público (sem precisar estar logado).
    function escapeHtml(texto) {
      if (texto === null || texto === undefined) return '';
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderPerfil(data) {
      const container = document.getElementById('perfil-content');
      const nome = escapeHtml(data.nome_exibicao || data.nome || 'Colecionador');
      const ano = data.data_criacao ? data.data_criacao.split('-')[0] : '';
      const avatarHtml = data.foto_url ? `<img src="${data.foto_url}" alt="${nome}">` : nome.charAt(0).toUpperCase();
      const formatosBadge = (data.formatos_possuidos || []).map(f => NOME_FORMATO[f] || f).join(' · ');

      let html = `
        <div class="pp-hero-banner">
          <div class="pp-hero-inner">
            <div class="pp-avatar">${avatarHtml}</div>
            <div class="pp-meta">
              <div class="pp-name">${nome}${formatosBadge ? `<span class="badge">${formatosBadge}</span>` : ''}</div>
              ${data.bio ? `<div class="pp-bio">${escapeHtml(data.bio)}</div>` : ''}
              <div class="pp-details">
                ${data.localizacao ? `<span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${escapeHtml(data.localizacao)}</span>` : ''}
                ${ano ? `<span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> membro desde ${ano}</span>` : ''}
                <span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg> ${data.total_discos || 0} discos</span>
              </div>
              ${(data.spotify_url || data.discogs_url || data.instagram_url) ? `
                <div class="pp-social-links">
                  ${data.spotify_url ? `<a href="${data.spotify_url}" target="_blank" rel="noopener">Spotify</a>` : ''}
                  ${data.discogs_url ? `<a href="${data.discogs_url}" target="_blank" rel="noopener">Discogs</a>` : ''}
                  ${data.instagram_url ? `<a href="${data.instagram_url}" target="_blank" rel="noopener">Instagram</a>` : ''}
                </div>
              ` : ''}
              ${data.generos_favoritos && data.generos_favoritos.length > 0 ? `
                <div class="pp-genre-tags">
                  ${data.generos_favoritos.map((g, i) => `<span class="tag${i < 3 ? ' active' : ''}">${escapeHtml(g)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      const vinil = (data.colecao_por_formato && data.colecao_por_formato.vinil.length) || 0;
      const cds = (data.colecao_por_formato && data.colecao_por_formato.cd.length) || 0;
      const cassetes = (data.colecao_por_formato && data.colecao_por_formato.cassete.length) || 0;
      html += `
        <div class="pp-stats-row">
          <div class="pp-stat-item"><div class="number">${data.total_discos || 0}</div><div class="label">Discos</div></div>
          <div class="pp-stat-item"><div class="number">${data.total_artistas || 0}</div><div class="label">Artistas</div></div>
          <div class="pp-stat-item"><div class="number"><span class="accent">${vinil}</span></div><div class="label">Vinil</div></div>
          <div class="pp-stat-item"><div class="number"><span class="accent">${cds}</span></div><div class="label">CDs</div></div>
          <div class="pp-stat-item"><div class="number"><span class="accent">${cassetes}</span></div><div class="label">Cassetes</div></div>
          <div class="pp-stat-item"><div class="number">${data.total_wishlist || 0}</div><div class="label">Wishlist</div></div>
        </div>
      `;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg> Álbuns favoritos</h2></div>`;
      if (data.favoritos && data.favoritos.length > 0) {
        if (data.favoritos_e_provisorio) {
          html += `<div class="pp-empty-note" style="margin-bottom:10px;">Ninguém foi marcado como favorito ainda — mostrando os mais recentes por enquanto.</div>`;
        }
        html += `<div class="pp-fav-grid">`;
        data.favoritos.forEach((item, idx) => {
          html += `
            <div class="pp-fav-item">
              <div class="cover" ${montarCoverDiv(item)}>
                <span class="fallback-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><polygon points="12 2 22 12 12 22 2 12"/></svg></span>
                <span class="rank">#${idx + 1}</span>
              </div>
              <div class="info"><div class="title">${escapeHtml(item.album) || 'Álbum'}</div><div class="artist">${escapeHtml(item.artista) || 'Artista'}</div></div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="pp-empty-note">Este colecionador ainda não tem discos.</div>`;
      }
      html += `</div>`;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Adicionados recentemente</h2></div>`;
      if (data.recentes && data.recentes.length > 0) {
        html += `<div class="pp-recent-scroll">`;
        data.recentes.forEach(item => {
          html += `
            <div class="pp-recent-item">
              <div class="cover" ${montarCoverDiv(item)}><span class="fallback-icon">◈</span></div>
              <div class="info">
                <div class="title">${escapeHtml(item.album) || 'Álbum'}</div>
                <div class="artist">${escapeHtml(item.artista) || 'Artista'}</div>
                <div class="date">adicionado em ${item.data_adicao || '—'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="pp-empty-note">Nenhuma adição ainda.</div>`;
      }
      html += `</div>`;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Wishlist atual</h2></div>`;
      if (data.wishlist && data.wishlist.length > 0) {
        html += `<div class="pp-wishlist-grid">`;
        data.wishlist.slice(0, 6).forEach(item => {
          const cor = CORES_TIER[item.tier] || 'var(--c-color)';
          html += `
            <div class="pp-wishlist-item">
              <div class="cover" ${montarCoverDiv(item)}>
                <span class="priority" style="background:${cor};">${item.tier}</span>
                <span class="fallback-icon">◈</span>
              </div>
              <div class="info"><div class="title">${escapeHtml(item.album) || 'Álbum'}</div><div class="artist">${escapeHtml(item.artista) || 'Artista'}</div></div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="pp-empty-note">Sem itens na wishlist no momento.</div>`;
      }
      html += `</div>`;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> Destaques da coleção</h2></div><div class="pp-highlights-grid">`;
      if (data.genero_predominante) {
        html += `<div class="pp-highlight-card"><div class="value">${data.genero_predominante_pct}%</div><div class="label">${data.genero_predominante}</div><div class="sub">gênero predominante</div></div>`;
      }
      if (data.decada_favorita) {
        html += `<div class="pp-highlight-card"><div class="value">${data.decada_favorita.nome}</div><div class="label">década favorita</div><div class="sub">${data.decada_favorita.contagem} discos</div></div>`;
      }
      if (data.valor_total) {
        html += `<div class="pp-highlight-card"><div class="value">R$ ${data.valor_total}</div><div class="label">valor da coleção</div><div class="sub">estimado</div></div>`;
      }
      html += `<div class="pp-highlight-card"><div class="value">em breve</div><div class="label">completude</div><div class="sub">discografias completas</div></div>`;
      html += `</div></div>`;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Linha do tempo</h2></div><div class="pp-timeline">`;
      if (data.recentes && data.recentes.length > 0) {
        data.recentes.slice(0, 5).forEach(item => {
          html += `<div class="pp-timeline-item"><span class="icon">+</span><span class="text"><strong>${escapeHtml(item.album) || 'Álbum'}</strong> — ${escapeHtml(item.artista) || 'Artista'} adicionado à coleção</span><span class="time">${item.data_adicao || ''}</span></div>`;
        });
      } else {
        html += `<div class="pp-empty-note">Nenhuma atividade ainda.</div>`;
      }
      html += `</div></div>`;

      html += `<div class="pp-section"><div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Prévia da estante</h2></div>`;
      const todosDiscos = data.colecao_por_formato
        ? [...data.colecao_por_formato.vinil, ...data.colecao_por_formato.cd, ...data.colecao_por_formato.cassete, ...data.colecao_por_formato.dvd_bluray]
        : [];
      if (todosDiscos.length > 0) {
        html += `<div class="pp-shelf-grid">`;
        todosDiscos.slice(0, 24).forEach(item => {
          html += `<div class="pp-shelf-item" title="${escapeHtml(item.artista) || 'Artista'} — ${escapeHtml(item.album) || 'Álbum'}" ${montarCoverDiv(item)}><span class="fallback-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><polygon points="12 2 22 12 12 22 2 12"/></svg></span></div>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="pp-empty-note">Prateleira vazia.</div>`;
      }
      html += `</div>`;

      html += `
        <div class="pp-section">
          <div class="pp-section-header"><h2><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Gostos em comum</h2></div>
          <div class="pp-shared-taste">
            <div class="circle">—</div>
            <div class="info">
              <div class="label">compatibilidade com</div>
              <div class="name">Em breve — comparação entre colecionadores</div>
              <div class="tags"><span>Chega quando o Discoteca tiver mais de um usuário ativo</span></div>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
      configurarLazyLoadCapas();
    }

    document.addEventListener('DOMContentLoaded', carregarPerfil);
  </script>
</body>
</html>
