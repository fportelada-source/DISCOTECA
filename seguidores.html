  <script>
const API_URL = 'https://fportelada.pythonanywhere.com';
function apiFetch(url, opcoes = {}) {
  let t = null; try { t = localStorage.getItem('discoteca_session_token'); } catch (e) {}
  return fetch(url, { ...opcoes, headers: { ...(opcoes.headers || {}), 'X-Session-Token': t || '' } });
}
(function () {
  let tok = null, nome = null;
  try { tok = localStorage.getItem('discoteca_session_token'); nome = localStorage.getItem('discoteca_user_nome'); } catch (e) {}
  if (!tok) { location.href = 'index.html'; return; }
  const n = document.getElementById('userNameDisplay'), av = document.getElementById('userAvatar');
  if (n && nome) { n.textContent = nome; av.textContent = nome.trim().charAt(0).toUpperCase() || '?'; }
})();
  </script>
  <script src="amigos.js?v=3"></script>
  <script>
(function () {
  const A = window.HillaAmigos, esc = A.esc;
  let nome = ''; try { nome = localStorage.getItem('discoteca_user_nome') || ''; } catch (e) {}
  if (nome) document.getElementById('sgNome').textContent = nome;
  const listas = { seguindo: null, seguidores: null };
  let aba = new URLSearchParams(location.search).get('aba') === 'seguidores' ? 'seguidores' : 'seguindo';
  const abas = { seguindo: document.getElementById('sgAbaSeguindo'), seguidores: document.getElementById('sgAbaSeguidores') };
  const lista = document.getElementById('sgLista'), busca = document.getElementById('sgBusca');
  const VAZIO = {
    seguindo: 'Você ainda não segue ninguém. Comece pelas sugestões ou pela busca em <a href="amigos.html">Amigos</a>.',
    seguidores: 'Ninguém segue você ainda. Compartilhe o link do seu perfil para os amigos encontrarem você.'
  };
  function desenhar() {
    const itens = listas[aba];
    if (!itens) { lista.innerHTML = '<div class="am-vazio">Carregando…</div>'; return; }
    const q = busca.value.trim().toLowerCase();
    const vis = q ? itens.filter(p => (p.nome || '').toLowerCase().includes(q)) : itens;
    if (!itens.length) { lista.innerHTML = `<div class="am-vazio">${VAZIO[aba]}</div>`; return; }
    if (!vis.length) { lista.innerHTML = `<div class="am-vazio">Ninguém com "${esc(busca.value.trim())}" nesta lista.</div>`; return; }
    lista.innerHTML = vis.map(p => A.linhaPessoa(p)).join('');
    // quem segue você e você ainda não segue: "Seguir de volta"
    if (aba === 'seguidores') lista.querySelectorAll('[data-seguir][data-seguindo="0"]').forEach(b => { b.textContent = 'Seguir de volta'; });
  }
  function abrir(qual, foco) {
    aba = qual;
    Object.entries(abas).forEach(([k, b]) => { b.setAttribute('aria-selected', k === qual ? 'true' : 'false'); b.tabIndex = k === qual ? 0 : -1; });
    history.replaceState(null, '', 'seguidores.html?aba=' + qual);
    desenhar();
    if (foco) abas[qual].focus();
  }
  Object.entries(abas).forEach(([k, b]) => {
    b.addEventListener('click', () => abrir(k));
    b.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); abrir(k === 'seguindo' ? 'seguidores' : 'seguindo', true); } });
  });
  busca.addEventListener('input', desenhar);
  function carregar() {
    A.api('/amigos').then(d => {
      listas.seguindo = d.seguindo;
      document.getElementById('sgNumSeguindo').textContent = d.seguindo_total;
      document.getElementById('sgNumSeguidores').textContent = d.seguidores_total;
      document.getElementById('sgRotSeguidores').textContent = d.seguidores_total === 1 ? 'seguidor' : 'seguidores';
      desenhar();
    }).catch(() => { lista.innerHTML = '<div class="am-vazio">Não deu para carregar agora. Tente de novo em instantes.</div>'; });
    A.api('/amigos/seguidores').then(d => { listas.seguidores = d.itens; desenhar(); }).catch(() => {});
  }
  // seguiu ou deixou de seguir: recarrega os números e as listas (a pessoa não some da tela na hora)
  document.addEventListener('am-seguiu', () => carregar());
  abrir(aba);
  carregar();
})();
  </script>
