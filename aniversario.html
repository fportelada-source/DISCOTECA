  <script>
const API_URL = 'https://fportelada.pythonanywhere.com';
function apiFetch(url, opcoes = {}) {
  let t = null; try { t = localStorage.getItem('discoteca_session_token'); } catch (e) {}
  return fetch(url, { ...opcoes, headers: { ...(opcoes.headers || {}), 'X-Session-Token': t || '' } });
}
(function () {
  let tok = null, nome = null;
  try { tok = localStorage.getItem('discoteca_session_token'); nome = localStorage.getItem('discoteca_user_nome'); } catch (e) {}
  if (!tok) { location.href = 'index.html'; return; }
  const n = document.getElementById('userNameDisplay'), av = document.getElementById('userAvatar');
  if (n && nome) { n.textContent = nome; av.textContent = nome.trim().charAt(0).toUpperCase() || '?'; }
})();
  </script>
  <script src="compartilhar.js?v=16"></script>
  <script>
(function () {
  const el = document.getElementById('anConteudo');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  if (!id) { el.innerHTML = '<div class="an-erro">Disco não encontrado.</div>'; return; }
  apiFetch(API_URL + '/aniversario/' + id).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
    const [a, m, dia] = d.data_original.split('-').map(Number);
    const anosTxt = d.anos + (d.anos === 1 ? ' ano' : ' anos');
    el.innerHTML = `<div class="an-eye">${d.hoje ? 'Aniversário na sua prateleira' : 'Disco da sua prateleira'}</div>
      <div class="an-capa" id="anCapa" role="img" aria-label="Capa de ${esc(d.album)}"></div>
      <h1>${esc(anosTxt)}</h1>
      <h2>${esc(d.album)} · ${esc(d.artista)}</h2>
      <p>Lançado em ${dia} de ${MESES[m - 1]} de ${a}.</p>
      <a class="an-btn" href="audicoes.html?ouvir=${d.id}">Registrar audição</a>
      <button type="button" class="an-btn2" id="anCompartilhar">Compartilhar</button>`;
    if (d.capa_url && /^https:\/\//.test(d.capa_url)) document.getElementById('anCapa').style.backgroundImage = `url("${d.capa_url.replace(/"/g, '%22')}")`;
    document.getElementById('anCompartilhar').addEventListener('click', () => window.DiscotecaCompartilhar.aniversario(d));
    document.title = `${anosTxt} de ${d.album} — Hilla`;
  }).catch(() => { el.innerHTML = '<div class="an-erro">Não encontrei esse disco na sua prateleira.</div>'; });
})();
  </script>
