  <script>
    const API_URL = 'https://fportelada.pythonanywhere.com';


// Toda chamada ao backend passa por aqui — garante que o cookie de
// sessão (login de verdade) sempre vá junto, mesmo entre domínios
// diferentes (GitHub Pages -> PythonAnywhere). Sem isso, o navegador
// não manda o cookie, e a autenticação real nunca chega a funcionar.
function apiFetch(url, opcoes = {}) {
  const sessaoToken = localStorage.getItem('discoteca_session_token');
  const opcoesFinais = { ...opcoes };
  opcoesFinais.headers = { ...(opcoes.headers || {}), 'X-Session-Token': sessaoToken || '' };
  return fetch(url, opcoesFinais);
}
    const CORES_TIER = { S: 'var(--s-color)', A: 'var(--a-color)', B: 'var(--b-color)', C: 'var(--c-color)' };
    const NOME_FORMATO = { vinil: 'Vinil', cd: 'CD', cassete: 'Cassete', dvd_bluray: 'DVD/Blu-ray' };

    // ================================================================
    // LAST.FM — só como último recurso (Discogs é a fonte principal)
    // ================================================================
    async function getCoverUrlLastfm(artist, album) {
      // Capa pelo SERVIDOR (Last.fm com a chave do servidor + Discogs). O navegador não
      // consulta mais o Last.fm direto: a chave pública levou bloqueio (erro 29).
      if (!artist || !album) return null;
      try {
        const d = await (await fetch(API_URL + `/buscar_capa?artista=${encodeURIComponent(artist)}&album=${encodeURIComponent(album)}`)).json();
        return (d && d.capa_url) || null;
      } catch { return null; }
    }

    function aplicarCapa(el, url) {
      const img = new Image();
      // Sem crossOrigin — mesmo motivo do colecao.html: nada aqui lê
      // pixel via canvas, e essa exigência derrubava capas de hosts
      // sem cabeçalho CORS mesmo a imagem sendo válida.
      img.onload = () => {
        el.style.backgroundImage = `url('${url}')`;
        const icone = el.querySelector('.fallback-icon');
        if (icone) icone.style.display = 'none';
      };
      img.src = url;
    }

    // Prioridade: capa já salva <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> Discogs sob demanda <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;display:inline-block;flex-shrink:0;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> Last.fm por último.
    // Lazy (só busca quando o card entra na tela) — importante pra prateleiras grandes.
    function configurarLazyLoadCapas() {
      const itens = document.querySelectorAll('[data-artista][data-album]');
      const carregar = (el) => {
        if (el.dataset.capaCarregada) return;
        el.dataset.capaCarregada = '1';
        const artista = el.dataset.artista, album = el.dataset.album, capaSalva = el.dataset.capa;
        if (capaSalva) { aplicarCapa(el, capaSalva); return; }
        apiFetch(API_URL + `/buscar_capa?artista=${encodeURIComponent(artista)}&album=${encodeURIComponent(album)}`)
          .then(r => r.json())
          .then(d => {
            if (d.sucesso && d.capa_url) aplicarCapa(el, d.capa_url);
            else getCoverUrlLastfm(artista, album).then(url => { if (url) aplicarCapa(el, url); });
          })
          .catch(() => {});
      };
      if (!('IntersectionObserver' in window)) { itens.forEach(carregar); return; }
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { carregar(entry.target); obs.unobserve(entry.target); }
        });
      }, { rootMargin: '200px' });
      itens.forEach(el => observer.observe(el));
    }

    function getCor(texto) {
      const CORES = ['#1b1b1c', '#1e1c19', '#1a1c1f', '#1d1a1c', '#1a1d1b', '#1f1d18'];
      const hash = (texto || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      return CORES[hash % CORES.length];
    }


    // ================================================================
    // ÚLTIMAS AUDIÇÕES — janela pro histórico, não é feed social:
    // sem curtida, sem comentário. Nunca mostra nota nem id interno
    // (o endpoint público já não devolve). Sem audições: a seção nem aparece.
    // ================================================================
    let ppUserId = null;
    window.ppPlaceholder = function() {
      const s = document.createElement('span');
      s.className = 'aud-ph';
      s.setAttribute('aria-hidden', 'true');
      s.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>';
      return s;
    };
    function rotuloData(v) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || '');
      return m ? `${m[3]}/${m[2]}` : '';
    }
    function rotuloDataAudicao(iso, hora) {
      const [y, m, d] = iso.split('-').map(Number);
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const dia = new Date(y, m - 1, d);
      const diff = Math.round((hoje - dia) / 86400000);
      const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
      const base = diff === 0 ? 'Hoje' : diff === 1 ? 'Ontem' : `${d} ${meses[m - 1]}`;
      return hora && diff <= 1 ? `${base} · ${hora}` : base;
    }
    // ================================================================
    // COLUNAS DO COMPUTADOR: as duas terminam juntas.
    // Wishlist grande: cresce em linhas completas de 6 até a altura da direita; o resto no "Ver todos".
    // Wishlist pequena: Destaques e/ou Linha do tempo descem para a esquerda, o que equilibrar melhor.
    // ================================================================
    let wlExpandida = false;
    function equilibrarColunas() {
      const esq = document.querySelector('.p2-esq'), dir = document.querySelector('.p2-dir');
      if (!esq || !dir) return;
      const wl = document.getElementById('ppWl'), mais = document.getElementById('ppWlMais');
      const blocos = ['ppDest', 'ppLinha'].map(id => document.getElementById(id)).filter(Boolean);
      // volta tudo para o lugar de origem
      blocos.forEach(b => dir.appendChild(b));
      const itens = wl ? [...wl.children] : [];
      itens.forEach(i => { i.hidden = false; });
      if (mais) mais.hidden = true;
      if (window.innerWidth < 900) return;   // celular: uma coluna só, a faixa da wishlist mostra 18 (CSS)
      const alt = el => el.getBoundingClientRect().height;
      const POR_LINHA = 6;
      if (wl && itens.length && !wlExpandida) {
        const linhaH = alt(itens[0]) + 10;
        const semWl = alt(esq) - alt(wl);
        const total = Math.ceil(itens.length / POR_LINHA);
        if (semWl + total * linhaH > alt(dir)) {   // não cabe tudo: corta em linhas completas
          if (mais) mais.hidden = false;
          const semWlComBotao = alt(esq) - alt(wl);
          // o número de linhas que deixa as duas colunas mais perto da mesma altura
          const linhas = Math.min(total - 1, Math.max(1, Math.round((alt(dir) - semWlComBotao + 10) / linhaH)));
          if (mais) mais.hidden = true;
          if (linhas < total) {
            itens.forEach((i, k) => { i.hidden = k >= linhas * POR_LINHA; });
            if (mais) mais.hidden = false;
            return;
          }
        }
      }
      // wishlist pequena (ou já aberta): testa descer Linha do tempo, Destaques ou os dois
      const combos = [[], ...blocos.map(b => [b]).reverse(), blocos.length > 1 ? blocos : null].filter(Boolean);
      let melhor = null, menor = Infinity;
      combos.forEach(c => {
        blocos.forEach(b => dir.appendChild(b));
        c.forEach(b => esq.appendChild(b));
        const d = Math.abs(alt(esq) - alt(dir));
        if (d < menor - 1) { menor = d; melhor = c; }
      });
      blocos.forEach(b => dir.appendChild(b));
      (melhor || []).forEach(b => esq.appendChild(b));
    }
    let _redim = null;
    const reequilibrar = () => { clearTimeout(_redim); _redim = setTimeout(equilibrarColunas, 150); };
    window.addEventListener('resize', reequilibrar);
    // a coluna da direita termina de carregar depois (Vocês dois, audições): refaz a conta quando ela muda de tamanho
    let _altDir = 0;
    const _obsDir = 'ResizeObserver' in window ? new ResizeObserver(en => {
      const h = Math.round(en[0].contentRect.height);
      if (Math.abs(h - _altDir) > 4) { _altDir = h; reequilibrar(); }
    }) : null;

    async function carregarAudicoesPublicas() {
      const box = document.getElementById('ppAudicoes');
      if (!box || !ppUserId) return;
      try {
        const r = await apiFetch(API_URL + `/audicoes/publico/${ppUserId}?limite=10`);
        if (!r.ok) return;
        const d = await r.json();
        const itens = Array.isArray(d.itens) ? d.itens : [];
        if (!itens.length) return;
        const linhas = itens.slice(0, 5).map(it => {
          const foto = (it.foto && /^[0-9a-f]{32}$/.test(it.foto)) ? `${API_URL}/audicoes/foto/${it.foto}_t.jpg` : (it.capa_url || null);
          const img = foto ? `<img src="${escapeHtml(foto)}" alt="" loading="lazy" onerror="this.remove()">` : '';
          return `<div class="p2-it"><span class="p2-mini">${img}</span><div class="p2-tx"><b>${escapeHtml(it.album || '')}</b><span>${escapeHtml(it.artista || '')}</span></div><span class="p2-q">${escapeHtml(rotuloDataAudicao(it.data, it.hora))}</span></div>`;
        }).join('');
        box.innerHTML = `<div class="p2-sh"><h2>Últimas audições</h2><a class="p2-cont" href="audicoes.html?u=${ppUserId}">ver todas</a></div><div class="p2-lista">${linhas}</div>`;
        box.style.display = 'block';
      } catch (e) { /* módulo é opcional: falhar não pode derrubar o perfil */ }
    }

    // ================================================================
    // CARREGAR
    // ================================================================
    function carregarPerfil() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('id');
      ppUserId = (userId || '').replace(/[^0-9]/g, '');
      if (!userId) {
        document.getElementById('perfil-content').innerHTML =
          `<div style="text-align:center; padding:80px 20px;">Perfil não especificado. Use o link com <code>?id=</code>.</div>`;
        return;
      }
      apiFetch(API_URL + `/perfil/${userId}`)
        .then(async r => {
          if (!r.ok) {
            const corpo = await r.json().catch(() => ({}));
            throw new Error(corpo.erro || 'Perfil não encontrado');
          }
          return r.json();
        })
        .then(renderPerfil)
        .catch(err => {
          try { const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m); } catch (e) {}
          document.getElementById('perfil-content').innerHTML =
            `<div style="text-align:center; padding:80px 20px;">${err.message || 'Erro ao carregar perfil'}</div>`;
        });
    }

    // ================================================================
    // WISHLIST PÚBLICA — paginada de 6 em 6, pra dar pra navegar a
    // wishlist inteira (ex: alguém procurando ideia de presente).
    // ================================================================
    let ppWishlistCompleta = [];
    let ppWishlistPagina = 0;
    const PP_WISHLIST_POR_PAGINA = 6;

    function montarWishlistCard(item) {
      const cor = CORES_TIER[item.tier] || 'var(--c-color)';
      return `
        <div class="pp-wishlist-item">
          <div class="cover" ${montarCoverDiv(item)}>
            <span class="priority" style="background:${cor};">${item.tier}</span>
            <span class="fallback-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span>
          </div>
          <div class="info"><div class="title">${escapeHtml(item.album) || 'Álbum'}</div><div class="artist">${escapeHtml(item.artista) || 'Artista'}</div></div>
        </div>
      `;
    }

    function renderWishlistPagina() {
      const grid = document.getElementById('ppWishlistGrid');
      if (!grid) return;
      const total = ppWishlistCompleta.length;
      const totalPaginas = Math.max(1, Math.ceil(total / PP_WISHLIST_POR_PAGINA));
      ppWishlistPagina = Math.min(ppWishlistPagina, totalPaginas - 1);
      const inicio = ppWishlistPagina * PP_WISHLIST_POR_PAGINA;
      const pagina = ppWishlistCompleta.slice(inicio, inicio + PP_WISHLIST_POR_PAGINA);

      grid.innerHTML = pagina.map(montarWishlistCard).join('');

      const contador = document.getElementById('ppWishlistContador');
      const btnAnterior = document.getElementById('ppWishlistAnterior');
      const btnProximo = document.getElementById('ppWishlistProximo');
      if (contador) contador.textContent = `${ppWishlistPagina + 1} de ${totalPaginas} · ${total} ${total === 1 ? 'item' : 'itens'}`;
      if (btnAnterior) btnAnterior.disabled = ppWishlistPagina === 0;
      if (btnProximo) btnProximo.disabled = ppWishlistPagina >= totalPaginas - 1;

      configurarLazyLoadCapas();
    }

    function mudarPaginaWishlist(delta) {
      const totalPaginas = Math.max(1, Math.ceil(ppWishlistCompleta.length / PP_WISHLIST_POR_PAGINA));
      ppWishlistPagina = Math.min(totalPaginas - 1, Math.max(0, ppWishlistPagina + delta));
      renderWishlistPagina();
    }

    function montarCoverDiv(item) {
      const cor = getCor(item.artista);
      const capaAttr = item.capa_url ? ` data-capa="${escapeHtml(item.capa_url)}"` : '';
      return `data-artista="${escapeHtml(item.artista || '')}" data-album="${escapeHtml(item.album || '')}"${capaAttr} style="background-color:${cor}; background-size:cover; background-position:center;"`;
    }

    // Escapa qualquer texto vindo de dados do usuário (bio, nome, artista,
    // álbum, etc.) antes de inserir no HTML — sem isso, alguém poderia
    // colocar <script> na própria bio e rodar código no navegador de
    // QUALQUER visitante do perfil público (sem precisar estar logado).
    // Link do perfil: só https:// e sempre tratado (o servidor também valida)
    function linkPerfil(url, rotulo) {
      url = (url || '').trim();
      if (!/^https:\/\/[^\s"'<>`]+$/i.test(url)) return '';
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${rotulo}</a>`;
    }
    function escapeHtml(texto) {
      if (texto === null || texto === undefined) return '';
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderPerfil(data) {
      const container = document.getElementById('perfil-content');
      const nome = escapeHtml(data.nome_exibicao || data.nome || 'Colecionador');
      const ano = data.data_criacao ? data.data_criacao.split('-')[0] : '';
      const avatarHtml = data.foto_url ? `<img src="${escapeHtml(data.foto_url)}" alt="${nome}">` : nome.charAt(0).toUpperCase();
      const formatosBadge = (data.formatos_possuidos || []).map(f => NOME_FORMATO[f] || f).join(' · ');

      // Google: título e descrição com o nome e os discos; sem "Aparecer no Google", noindex
      try {
        const artistasTop = [...new Set((data.recentes || []).map(d => d.artista).filter(Boolean))].slice(0, 4);
        document.title = `Prateleira de ${data.nome_exibicao || data.nome || 'colecionador'} · ${data.total_discos || 0} discos · Hilla`;
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', `${data.total_discos || 0} discos de vinil, CD e mais na Hilla` + (artistasTop.length ? `: ${artistasTop.join(', ')} e outros.` : '.'));
        if (!data.no_google) {
          const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m);
        } else {
          const l = document.createElement('link'); l.rel = 'canonical'; l.href = 'https://hilla.com.br/perfil-publico.html?id=' + ppUserId; document.head.appendChild(l);
        }
      } catch (e) {}

      // ===== Layout enxuto (09/11/2026): topo compacto, capas pequenas, duas colunas no computador =====
      const ic = d => `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
      const capaMini = (item, extra) => `<div class="p2-cv" ${montarCoverDiv(item)}>${extra || ''}<span class="fallback-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></span></div>`;
      const disco = (item, extra) => `<div class="p2-disco">${capaMini(item, extra)}<div class="p2-lb"><b>${escapeHtml(item.album) || 'Álbum'}</b><span>${escapeHtml(item.artista) || 'Artista'}</span></div></div>`;
      const sec = (titulo, corpo, link) => `<section class="p2-sec"><div class="p2-sh"><h2>${titulo}</h2>${link || ''}</div>${corpo}</section>`;
      const secId = (id, titulo, corpo, link) => `<section class="p2-sec" id="${id}"><div class="p2-sh"><h2>${titulo}</h2>${link || ''}</div>${corpo}</section>`;

      const vinil = (data.colecao_por_formato && data.colecao_por_formato.vinil.length) || 0;
      const cds = (data.colecao_por_formato && data.colecao_por_formato.cd.length) || 0;
      const cassetes = (data.colecao_por_formato && data.colecao_por_formato.cassete.length) || 0;
      const dvds = (data.colecao_por_formato && data.colecao_por_formato.dvd_bluray.length) || 0;

      // bio e etiquetas: ao lado do nome no computador, embaixo de tudo no celular (o CSS mostra um ou outro)
      const bioChips = (data.bio ? `<p class="p2-bio">${escapeHtml(data.bio)}</p>` : '') + `<div class="p2-chips">
              ${formatosBadge ? `<span class="p2-chip">${formatosBadge}</span>` : ''}
              ${linkPerfil(data.spotify_url, 'Spotify')}${linkPerfil(data.discogs_url, 'Discogs')}${linkPerfil(data.instagram_url, 'Instagram')}
              ${(data.generos_favoritos || []).slice(0, 3).map(g => `<span class="p2-chip">${escapeHtml(g)}</span>`).join('')}
            </div>`;
      let html = `
        <header class="p2-topo">
          <div class="p2-av">${avatarHtml}</div>
          <div class="p2-id">
            <h1 class="p2-nome">${nome}</h1>
            ${data.titulo ? `<div class="p2-titulo">${escapeHtml(data.titulo)}</div>` : ''}
            <div class="p2-meta">${[data.localizacao ? escapeHtml(data.localizacao) : '', ano ? 'na Hilla desde ' + ano : ''].filter(Boolean).join(' · ')}</div>
            ${bioChips}
          </div>
          ${bioChips}
          <div class="p2-seguir am-perfil-topo" id="amPerfilTopo" hidden></div>
        </header>
        <div class="p2-corpo"><div class="p2-esq">`;

      if (!data.prateleira_oculta) {
        html += `<div class="p2-nums">
          <div><b>${data.total_discos || 0}</b><span>Discos</span></div>
          <div><b>${data.total_artistas || 0}</b><span>Artistas</span></div>
          ${vinil ? `<div class="v"><b>${vinil}</b><span>Vinil</span></div>` : ''}
          ${cds ? `<div class="c"><b>${cds}</b><span>CDs</span></div>` : ''}
          ${cassetes ? `<div class="f"><b>${cassetes}</b><span>Fitas</span></div>` : ''}
          ${dvds ? `<div class="d"><b>${dvds}</b><span>DVDs</span></div>` : ''}
          ${data.total_wishlist != null ? `<div><b>${data.total_wishlist}</b><span>Wishlist</span></div>` : ''}
        </div>`;
      } else {
        html += `<div class="pp-empty-note" style="margin:0 0 20px;">A prateleira deste colecionador é privada.</div>`;
      }
      // "Vocês dois" vai aqui no celular (no computador, a coluna da direita mostra a mesma caixa)
      html += `<div class="am-perfil-compat p2-compat-cel" id="amPerfilCompat" hidden></div>`;

      if (!data.prateleira_oculta) {
        if (data.favoritos && data.favoritos.length) {
          html += sec('Favoritos', (data.favoritos_e_provisorio ? `<div class="p2-nota">Nenhum favorito marcado ainda. Mostrando os mais recentes.</div>` : '') +
            `<div class="p2-g4">${data.favoritos.slice(0, 4).map(i => disco(i)).join('')}</div>`);
        }
        if (data.recentes && data.recentes.length) {
          html += sec('Adicionados recentemente', `<div class="p2-faixa">${data.recentes.slice(0, 12).map(i => disco(i)).join('')}</div>`);
        }
      }
      if (data.wishlist && data.wishlist.length) {
        const n = data.total_wishlist || data.wishlist.length;
        // todos os discos vão para a página: no celular a faixa mostra 18; no computador a grade cresce
        // até a altura da coluna da direita (ver equilibrarColunas) e o resto fica no "Ver todos"
        html += sec('Wishlist', `<div class="p2-wl" id="ppWl">${data.wishlist.map(i => disco(i, `<span class="p2-tier" style="background:${CORES_TIER[i.tier] || 'var(--c-color)'}">${escapeHtml(i.tier || '')}</span>`)).join('')}</div>
          <button type="button" class="p2-mais" id="ppWlMais" hidden>Ver todos os ${data.wishlist.length} discos</button>`,
          `<span class="p2-cont">${n} ${n === 1 ? 'disco' : 'discos'}</span>`);
      }
      html += `</div><aside class="p2-dir">`;
      html += `<div class="am-perfil-compat p2-compat-desk" id="amPerfilCompatDesk" hidden></div>`;
      html += `<section class="p2-sec" id="ppConquistas" style="display:none;"></section>`;
      html += `<section class="p2-sec" id="ppAudicoes" style="display:none;"></section>`;

      // Destaques
      const dest = [];
      if (data.genero_predominante) dest.push([`${data.genero_predominante_pct}% ${escapeHtml(data.genero_predominante)}`, 'Gênero']);
      if (data.decada_favorita) dest.push([data.decada_favorita.nome, `Década · ${data.decada_favorita.contagem}`]);
      if (data.banda_mais_presente) dest.push([escapeHtml(data.banda_mais_presente), 'Artista mais presente']);
      const _nomesFmt = { vinil: 'Vinil', cd: 'CD', cassete: 'Cassete', dvd_bluray: 'DVD/Blu-ray' };
      const _porFmt = data.colecao_por_formato || {};
      const _contFmt = Object.keys(_nomesFmt).map(k => [k, (_porFmt[k] || []).length]).filter(x => x[1] > 0);
      const _totFmt = _contFmt.reduce((s, x) => s + x[1], 0);
      if (_totFmt) { const [kFmt, nFmt] = _contFmt.reduce((a, b) => (b[1] > a[1] ? b : a)); dest.push([`${Math.round(nFmt / _totFmt * 100)}% ${_nomesFmt[kFmt]}`, 'Formato']); }
      if (data.valor_total) dest.push([`R$ ${data.valor_total}`, 'Valor da prateleira']);
      if (dest.length) html += secId('ppDest', 'Destaques', `<div class="p2-dest">${dest.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`);

      // Linha do tempo
      if (data.recentes && data.recentes.length) {
        html += secId('ppLinha', 'Linha do tempo', `<div class="p2-lista">${data.recentes.slice(0, 5).map(i => `<div class="p2-it"><div class="p2-tx"><b>${escapeHtml(i.album) || 'Álbum'} · ${escapeHtml(i.artista) || 'Artista'}</b><span>entrou na prateleira</span></div><span class="p2-q">${escapeHtml(rotuloData(i.data_adicao))}</span></div>`).join('')}</div>`);
      }
      html += `</aside></div>`;

      container.innerHTML = html;
      if (window.DiscotecaConquistas) { DiscotecaConquistas.estilo(); DiscotecaConquistas.renderPublico(document.getElementById('ppConquistas'), data.conquistas_vitrine); }
      const mais = document.getElementById('ppWlMais');
      if (mais) mais.addEventListener('click', () => { wlExpandida = true; equilibrarColunas(); });
      equilibrarColunas();
      if (_obsDir) _obsDir.observe(document.querySelector('.p2-dir'));
      carregarAudicoesPublicas().then(equilibrarColunas);
      renderWishlistPagina();
      configurarLazyLoadCapas();
      if (window.HillaAmigos) {
        const cel = document.getElementById('amPerfilCompat'), desk = document.getElementById('amPerfilCompatDesk');
        HillaAmigos.blocoPerfil(document.getElementById('amPerfilTopo'), cel, ppUserId);
        // a mesma caixa aparece na coluna da direita no computador
        new MutationObserver(() => { desk.innerHTML = cel.innerHTML; desk.hidden = cel.hidden; }).observe(cel, { childList: true, attributes: true, attributeFilter: ['hidden'] });
      }
    }

    document.addEventListener('DOMContentLoaded', carregarPerfil);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
      });
    }
  </script>
  <script src="amigos.js?v=2"></script>
  <script src="conquistas.js?v=10"></script>
</body>
</html>
